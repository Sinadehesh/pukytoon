<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Bomber</title>
    <style>
        @font-face { font-family: 'Luckiest Guy'; font-display: swap; src: url('vendor/luckiest-guy-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Luckiest Guy'; font-display: swap; src: url('vendor/luckiest-guy-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    </style>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0f0c1d;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 40%, #2a1840 0%, #0f0c1d 70%);
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* on wide screens the game is a column in the middle */
        @media (min-aspect-ratio: 3/4) {
            canvas {
                border-radius: 12px;
                box-shadow: 0 0 60px rgba(255, 120, 40, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }
    </style>
    <!-- Matter.js for the bomb bay physics -->
    <script src="../../../sdk/pukytoon-sdk.js"></script>
    <script src="../../../sdk/pukytoon-embed.js"></script>
    <script src="vendor/matter.min.js"></script>
</head>
<body>
    <canvas id="game"></canvas>
    <script src="shapes.js"></script>
    <script src="ads.js"></script>
    <script src="bomber.js"></script>
</body>
</html>
