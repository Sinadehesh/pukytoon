<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Pukytoon game</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #15111f; touch-action: none;
                     user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; width: 100%; height: 100%; }
        #problem { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
                   color: #fff; font: 600 16px/1.5 system-ui, sans-serif; }
    </style>
    <!-- The runtime says when it's ready (after its pictures load), not the page -->
    <script>window.PUKYTOON_MANUAL_READY = true;</script>
    <script src="../sdk/pukytoon-sdk.js"></script>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="problem"></div>
    <script type="module" src="play.js"></script>
</body>
</html>
